<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d1b2a">
    <title>Bataille Navale Alpha vs Oméga</title>
    <link rel="manifest" href="manifest-battleship.json">
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@300;400;600;700;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-dark: #0d1b2a;
            --bg-medium: #1b263b;
            --bg-light: #2a3e5a;
            --accent-alpha: #00ff88;
            --accent-omega: #ff006e;
            --accent-gold: #ffd700;
            --water-color: #1e3a5f;
            --ship-color: #4a5568;
            --hit-color: #ff4444;
            --miss-color: #ffffff;
            --text-primary: #e0e1dd;
            --text-secondary: #a0a8b8;
            --border-color: rgba(224, 225, 221, 0.2);
        }

        body {
            font-family: 'Saira Condensed', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(0, 255, 136, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 110, 0.05) 0%, transparent 50%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 136, 0.03) 2px, rgba(0, 255, 136, 0.03) 4px);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 1rem;
            min-height: 100vh;
        }

        /* Screens */
        .screen { display: none; animation: fadeIn 0.4s ease-out; }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            text-align: center;
            padding: 1.5rem 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, var(--accent-alpha), var(--accent-omega));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        /* Buttons */
        .btn {
            padding: 0.9rem 2.2rem;
            font-family: 'Saira Condensed', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            background: var(--bg-light);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            background: rgba(255,255,255,0.1);
            transform: translate(-50%,-50%);
            transition: width 0.3s, height 0.3s;
        }
        .btn:hover::before { width: 300px; height: 300px; }
        .btn:hover { transform: translateY(-2px); }
        .btn-alpha { border-color: var(--accent-alpha); background: rgba(0,255,136,0.1); }
        .btn-alpha:hover { background: rgba(0,255,136,0.2); box-shadow: 0 0 25px rgba(0,255,136,0.4); }
        .btn-omega { border-color: var(--accent-omega); background: rgba(255,0,110,0.1); }
        .btn-omega:hover { background: rgba(255,0,110,0.2); box-shadow: 0 0 25px rgba(255,0,110,0.4); }
        .btn-secondary { background: var(--bg-medium); border-color: var(--text-secondary); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Menu */
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 500px;
            margin: 3rem auto;
        }

        .saved-games { margin-top: 3rem; }
        .saved-games h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .game-list { display: grid; gap: 1rem; max-width: 800px; margin: 0 auto; }

        .game-card {
            background: var(--bg-medium);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .game-card:hover {
            border-color: var(--accent-alpha);
            background: var(--bg-light);
            transform: translateX(5px);
        }
        .game-card h3 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--accent-alpha); }
        .game-meta { display: flex; gap: 2rem; color: var(--text-secondary); font-size: 0.95rem; }

        .delete-btn {
            padding: 0.5rem 1rem;
            background: rgba(255,0,100,0.2);
            border: 1px solid rgba(255,0,100,0.5);
            color: #ff0064;
            cursor: pointer;
            font-family: 'Saira Condensed', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .delete-btn:hover { background: rgba(255,0,100,0.3); box-shadow: 0 0 15px rgba(255,0,100,0.4); }

        /* Create Screen */
        .create-layout {
            display: grid;
            grid-template-areas: "name name" "alpha omega" "actions actions";
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .game-name-section { grid-area: name; }
        .game-name-section h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--accent-gold);
            text-transform: uppercase;
        }
        .game-name-section input {
            width: 100%;
            padding: 1rem;
            background: var(--bg-medium);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            font-family: 'Saira Condensed', sans-serif;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        .game-name-section input:focus {
            outline: none;
            border-color: var(--accent-alpha);
            box-shadow: 0 0 15px rgba(0,255,136,0.2);
        }

        .grid-section {
            background: var(--bg-medium);
            border: 2px solid var(--border-color);
            padding: 1.5rem;
        }
        .grid-section.alpha { grid-area: alpha; border-color: var(--accent-alpha); }
        .grid-section.omega { grid-area: omega; border-color: var(--accent-omega); }
        .grid-section h3 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }
        .grid-section.alpha h3 { color: var(--accent-alpha); }
        .grid-section.omega h3 { color: var(--accent-omega); }

        /* Grid */
        .grid-container { display: inline-block; position: relative; }
        .grid {
            display: grid;
            grid-template-columns: 40px repeat(6, 60px);
            grid-template-rows: 40px repeat(6, 60px);
            gap: 2px;
            background: var(--water-color);
            padding: 2px;
            margin: 12px 0;
        }
        .grid-cell {
            background: var(--water-color);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier Prime', monospace;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-secondary);
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .grid-cell.label { background: var(--bg-light); cursor: default; font-size: 1rem; }
        .grid-cell.playable:hover { background: rgba(0,255,136,0.2); border-color: var(--accent-alpha); }
        .grid-cell.ship { background: var(--ship-color); border-color: var(--accent-alpha); }
        .grid-cell.hit { background: var(--hit-color); position: relative; }
        .grid-cell.hit::after { content: '✕'; font-size: 2rem; color: white; font-weight: 900; }
        .grid-cell.miss { background: var(--water-color); position: relative; }
        .grid-cell.miss::after { content: '○'; font-size: 1.5rem; color: var(--miss-color); }
        .grid-cell.placing { background: rgba(0,255,136,0.3); border-color: var(--accent-alpha); }
        .grid-cell.sunk { background: #8b0000 !important; }
        .grid-cell.sunk::after { content: '✕'; font-size: 2rem; color: #ff8888; font-weight: 900; }

        /* Ship Selection */
        .ship-selection { margin-top: 1.2rem; }
        .ship-selection h4 { font-size: 1.2rem; margin-bottom: 1rem; color: var(--text-secondary); }
        .ship-list { display: flex; gap: 1rem; flex-wrap: wrap; }
        .ship-btn {
            padding: 0.8rem 1.5rem;
            background: var(--bg-light);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            cursor: pointer;
            font-family: 'Saira Condensed', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .ship-btn:hover { border-color: var(--accent-alpha); background: rgba(0,255,136,0.1); }
        .ship-btn.selected { border-color: var(--accent-alpha); background: rgba(0,255,136,0.2); box-shadow: 0 0 15px rgba(0,255,136,0.3); }
        .ship-btn.placed { opacity: 0.5; cursor: not-allowed; }

        .orientation-toggle { margin-top: 1rem; }

        .create-actions {
            grid-area: actions;
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        /* ===== BATTLE SCREEN ===== */
        .battle-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            gap: 1rem;
        }

        .turn-indicator {
            flex: 1;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 0.7rem 1.5rem;
            border: 2px solid;
            background: var(--bg-medium);
        }
        .turn-indicator.alpha {
            color: var(--accent-alpha);
            border-color: var(--accent-alpha);
            text-shadow: 0 0 15px rgba(0,255,136,0.5);
            box-shadow: 0 0 20px rgba(0,255,136,0.15);
        }
        .turn-indicator.omega {
            color: var(--accent-omega);
            border-color: var(--accent-omega);
            text-shadow: 0 0 15px rgba(255,0,110,0.5);
            box-shadow: 0 0 20px rgba(255,0,110,0.15);
        }

        .battle-grids {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .battle-grid-panel {
            background: var(--bg-medium);
            border: 2px solid var(--border-color);
            padding: 1.5rem;
            position: relative;
        }
        .battle-grid-panel.alpha { border-color: var(--accent-alpha); }
        .battle-grid-panel.omega { border-color: var(--accent-omega); }

        .battle-grid-panel .panel-title {
            font-size: 1.4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .battle-grid-panel.alpha .panel-title { color: var(--accent-alpha); }
        .battle-grid-panel.omega .panel-title { color: var(--accent-omega); }

        .panel-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }

        .ship-counter {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border: 1px solid;
            font-size: 0.95rem;
            font-family: 'Courier Prime', monospace;
            margin-top: 0.3rem;
        }
        .battle-grid-panel.alpha .ship-counter { border-color: var(--accent-alpha); color: var(--accent-alpha); }
        .battle-grid-panel.omega .ship-counter { border-color: var(--accent-omega); color: var(--accent-omega); }

        /* Target panel — the enemy grid — gets a glow overlay when it's your turn to attack */
        .battle-grid-panel.target-active {
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.25);
        }
        .battle-grid-panel.target-active::before {
            content: '🎯 CIBLER';
            position: absolute;
            top: 0.5rem; right: 0.8rem;
            font-size: 0.85rem;
            color: var(--accent-gold);
            letter-spacing: 0.1em;
            animation: blink 1.2s ease-in-out infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* Clicking is disabled on own grid */
        .battle-grid-panel.own-grid .grid-cell.playable { cursor: default; }
        .battle-grid-panel.own-grid .grid-cell.playable:hover { background: var(--water-color); border-color: rgba(255,255,255,0.1); }

        .last-shot-msg {
            margin-top: 0.8rem;
            min-height: 1.5rem;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
        .last-shot-msg.hit-msg { color: var(--hit-color); }
        .last-shot-msg.sunk-msg { color: var(--accent-gold); }
        .last-shot-msg.miss-msg { color: var(--text-secondary); }

        .battle-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        /* Victory Screen */
        .victory-container {
            max-width: 800px;
            margin: 4rem auto;
            background: var(--bg-medium);
            border: 3px solid var(--accent-gold);
            padding: 4rem;
            text-align: center;
        }
        .victory-container h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }
        .victory-container h1.alpha { color: var(--accent-alpha); text-shadow: 0 0 30px rgba(0,255,136,0.6); }
        .victory-container h1.omega { color: var(--accent-omega); text-shadow: 0 0 30px rgba(255,0,110,0.6); }
        .victory-container p { font-size: 1.5rem; color: var(--text-secondary); margin-bottom: 3rem; }

        /* Stats in victory */
        .victory-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }
        .stat-block {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 1rem;
        }
        .stat-block .stat-label { font-size: 0.95rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; }
        .stat-block .stat-value { font-size: 2rem; font-weight: 900; margin-top: 0.3rem; }
        .stat-block.alpha .stat-value { color: var(--accent-alpha); }
        .stat-block.omega .stat-value { color: var(--accent-omega); }

        /* Modal */
        .modal { display: none; position: fixed; top:0;left:0;width:100%;height:100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-medium); border: 2px solid var(--accent-gold); padding: 2rem; max-width: 500px; width: 90%; }
        .modal-content h3 { font-size: 1.8rem; margin-bottom: 1.5rem; color: var(--accent-gold); text-align: center; }
        .modal-content p { font-size: 1.2rem; margin-bottom: 1.5rem; text-align: center; }
        .modal-actions { display: flex; gap: 1rem; justify-content: center; }

        /* Shot animation */
        @keyframes shotFlash {
            0% { transform: scale(1); }
            30% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
        .grid-cell.just-shot { animation: shotFlash 0.35s ease-out; }

        /* Responsive */
        @media (max-width: 1100px) {
            .battle-grids { grid-template-columns: 1fr; }
            .create-layout { grid-template-areas: "name" "alpha" "omega" "actions"; grid-template-columns: 1fr; }
            .battle-grid-panel.target-active::before { display: none; }
        }
        @media (max-width: 768px) {
            .logo { font-size: 2.2rem; }
            .grid { grid-template-columns: 28px repeat(6, 42px); grid-template-rows: 28px repeat(6, 42px); }
            .grid-cell { font-size: 0.75rem; }
            .battle-header { flex-direction: column; }
        }

        .loading { display: inline-block; width:20px;height:20px; border:3px solid var(--border-color); border-top-color:var(--accent-alpha); border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

/* Reset des anciennes variables */

    --text-primary: #1e293b;

    box-shadow: 0 4px 6px -1px rgba(147, 51, 234, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.06) !important;

.btn-omega:hover {
    background: linear-gradient(135deg, #7e22ce 0%, #6b21a8 100%) !important;
    box-shadow: 0 10px 15px -3px rgba(147, 51, 234, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.05) !important;

/* Boutons de navigation */
#syncBtn,
button[onclick*="showCreateGame"],
button[onclick*="loadSavedGames"] {
    background: white !important;
    color: var(--bg-primary) !important;
    border: 2px solid white !important;
}

#syncBtn:hover,
button[onclick*="showCreateGame"]:hover,
button[onclick*="loadSavedGames"]:hover {

}

/* Grilles */
.grid-container {
    gap: 0.25rem !important;
    margin: 1.5rem auto !important;
    display: grid !important;
    justify-content: center !important;
    width: fit-content !important;
}

.grid-cell {
    background: #f9fafb !important;
    border: 2px solid #e5e7eb !important;
    border-radius: 0.375rem !important;
    font-weight: 700 !important;
    font-family: inherit !important;
    color: #1e293b !important;
}

.grid-cell.label {
    background: transparent !important;
    border: none !important;
    color: white !important;
    font-weight: 700 !important;
}

.grid-cell.playable {
    cursor: pointer !important;
    transition: all 0.2s ease !important;
}

.grid-cell.playable:hover {
    border-color: var(--accent-blue) !important;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2) !important;

}

.grid-cell.ship {
    background: linear-gradient(135deg, var(--ship-color) 0%, #059669 100%) !important;

}

.grid-cell.placing {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.5) 0%, rgba(5, 150, 105, 0.5) 100%) !important;

}

.grid-cell.hit {
    background: linear-gradient(135deg, var(--hit-color) 0%, #dc2626 100%) !important;
    border-color: var(--hit-color) !important;
}

.grid-cell.miss {
    background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%) !important;
    border-color: #93c5fd !important;
}

/* Boutons de navires */
.ship-btn {
    padding: 0.75rem 1.5rem !important;
    background: white !important;
    border: 2px solid #e5e7eb !important;
    border-radius: 0.5rem !important;
    color: var(--text-primary) !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    transition: all 0.2s ease !important;
}

.ship-btn:hover {
    border-color: var(--accent-blue) !important;
    background: #f9fafb !important;
}

.ship-btn.selected {
    border-color: var(--accent-blue) !important;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(37, 99, 235, 0.1) 100%) !important;
    color: var(--accent-blue) !important;
}

.ship-btn.placed {
    background: #f3f4f6 !important;
    color: var(--text-secondary) !important;

    opacity: 0.5 !important;
}

/* Boutons d'orientation */
button[onclick*="toggleOrientation"] {
    padding: 0.5rem 1rem !important;
    background: white !important;
    border: 2px solid #e5e7eb !important;
    border-radius: 0.5rem !important;
    color: var(--text-primary) !important;
    font-weight: 500 !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 0.5rem !important;
}

button[onclick*="toggleOrientation"]:hover {
    border-color: var(--accent-blue) !important;
    background: #f9fafb !important;
}

/* Team indicators */
.team-indicator {
    font-size: 2rem !important;
    font-weight: 800 !important;
    text-align: center !important;
    margin: 1.5rem 0 !important;
    padding: 1rem !important;
    border-radius: 0.5rem !important;
    text-transform: none !important;
    letter-spacing: normal !important;
    text-shadow: none !important;
}

.team-indicator.alpha {
    background: linear-gradient(135deg, rgba(5, 150, 105, 0.15) 0%, rgba(4, 120, 87, 0.15) 100%) !important;
    color: #065f46 !important;
    border: 3px solid #10b981 !important;
}

.team-indicator.omega {
    background: linear-gradient(135deg, rgba(147, 51, 234, 0.15) 0%, rgba(126, 34, 206, 0.15) 100%) !important;
    color: #6b21a8 !important;
    border: 3px solid #a855f7 !important;
}

/* Cartes de jeu sauvegardé */
.game-card {
    background: white !important;
    border: 2px solid #e5e7eb !important;
    border-radius: 0.75rem !important;
    padding: 1.5rem !important;
    cursor: pointer !important;
    transition: all 0.2s ease !important;
}

.game-card:hover {
    border-color: var(--accent-blue) !important;
    box-shadow: var(--shadow-lg) !important;
    transform: translateY(-2px) !important;
}

.game-card h3 {
    color: #0f172a !important;
    font-size: 1.25rem !important;
    font-weight: 800 !important;
    margin-bottom: 0.5rem !important;
}

.game-meta {
    color: #475569 !important;
    font-size: 0.875rem !important;
    font-weight: 600 !important;
}

.game-meta span {
    color: #334155 !important;
}

.delete-btn {
    background: #fee2e2 !important;
    color: #991b1b !important;
    border: 2px solid #fecaca !important;
    padding: 0.5rem 1rem !important;
    border-radius: 0.375rem !important;
    font-weight: 700 !important;
    font-size: 0.875rem !important;
}

.delete-btn:hover {
    background: #fca5a5 !important;
    border-color: #f87171 !important;
    color: #7f1d1d !important;
}

/* Modal */
.modal {
    background: rgba(0, 0, 0, 0.75) !important;
    backdrop-filter: blur(8px) !important;
    overflow-y: auto !important;
    padding: 2rem 1rem !important;
}

.modal-content {
    background: white !important;
    border-radius: var(--border-radius) !important;
    padding: 2rem !important;
    box-shadow: var(--shadow-xl) !important;
    border: none !important;
    color: var(--text-primary) !important;
    max-height: 90vh !important;
    overflow-y: auto !important;
}

.modal-content h3 {
    color: #0f172a !important;
    font-weight: 800 !important;
    font-size: 1.75rem !important;
    margin-bottom: 1.5rem !important;
    text-align: center !important;
}

/* Checkboxes de thèmes */
.theme-list {
    display: grid !important;
    gap: 0.75rem !important;
    margin: 1.5rem 0 !important;
    max-height: 400px !important;
    overflow-y: auto !important;
    padding: 0.5rem !important;
}

.theme-checkbox {
    background: white !important;
    border: 2px solid #e5e7eb !important;
    border-radius: 0.5rem !important;
    padding: 1rem !important;
    display: flex !important;
    align-items: center !important;
    gap: 0.75rem !important;
    cursor: pointer !important;
    transition: all 0.2s ease !important;
}

.theme-checkbox:hover {
    border-color: var(--accent-blue) !important;
    background: #f9fafb !important;
}

.theme-checkbox.checked {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%) !important;
    color: white !important;
    border-color: #3b82f6 !important;
}

.theme-checkbox input[type="checkbox"] {
    width: 1.25rem !important;
    height: 1.25rem !important;
    cursor: pointer !important;
    flex-shrink: 0 !important;
}

.theme-checkbox label {
    cursor: pointer !important;
    flex: 1 !important;
    color: #0f172a !important;
    font-weight: 600 !important;
    font-size: 1rem !important;
    margin: 0 !important;
}

.theme-checkbox.checked label {
    color: white !important;
}

/* Inputs */
input[type="text"],
input[type="number"],
.answer-input,
#answerInput {
    background: white !important;
    border: 3px solid #cbd5e1 !important;
    border-radius: 0.5rem !important;
    padding: 0.75rem !important;
    color: #0f172a !important;
    font-size: 1rem !important;
    font-weight: 600 !important;
    width: 100% !important;
    max-width: 600px !important;
    transition: all 0.2s ease !important;
    display: block !important;
    margin-left: auto !important;
    margin-right: auto !important;
}

input[type="text"]:focus,
input[type="number"]:focus,
.answer-input:focus,
#answerInput:focus {
    outline: none !important;
    border-color: #2563eb !important;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15) !important;
}

.answer-input,
#answerInput {
    font-size: 1.125rem !important;
    padding: 1rem !important;
    font-weight: 600 !important;
}

/* Inputs dans les sections de configuration (ne pas limiter la largeur) */
.game-name-section input[type="text"],
#gameName,
#timerMinutes,
#timerSeconds {
    max-width: none !important;
}

/* Question screen */
.question-container .question-theme,
#questionTheme {
    display: block !important;
    text-align: center !important;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%) !important;
    color: white !important;
    padding: 0.75rem 1.5rem !important;
    border-radius: 0.5rem !important;
    font-weight: 700 !important;
    font-size: 1rem !important;
    margin: 0 auto 1.5rem !important;
    width: fit-content !important;
    box-shadow: var(--shadow-md) !important;
}

.question-container .question-text,
#questionText {
    font-size: 1.5rem !important;
    font-weight: 700 !important;
    color: #0f172a !important;
    margin: 1.5rem 0 !important;
    line-height: 1.6 !important;
    text-align: center !important;
}

.question-container .question-image,
#questionImage {
    max-width: 100% !important;
    max-height: 400px !important;
    height: auto !important;
    border-radius: 0.75rem !important;
    margin: 1.5rem auto !important;
    display: block !important;
    box-shadow: var(--shadow-lg) !important;
}

/* Feedback des réponses */
.answer-feedback {
    padding: 1rem !important;
    border-radius: 0.5rem !important;
    font-weight: 700 !important;
    font-size: 1.25rem !important;
    margin: 1rem auto !important;
    max-width: 600px !important;
    width: 100% !important;
    text-align: center !important;
}

.answer-feedback.correct {
    background: #d1fae5 !important;
    color: #064e3b !important;
    border: 3px solid #10b981 !important;
}

.answer-feedback.incorrect {
    background: #fee2e2 !important;
    color: #7f1d1d !important;
    border: 3px solid #ef4444 !important;
}

.correct-answer {
    padding: 1rem !important;
    background: #f1f5f9 !important;
    border-radius: 0.5rem !important;
    color: #0f172a !important;
    font-weight: 600 !important;
    margin: 1rem 0 !important;
    border: 2px solid #cbd5e1 !important;
}

.correct-answer strong {
    color: #0f172a !important;
}

/* Bouton override */
.override-btn {
    margin-top: 0.5rem !important;
}

/* Victory screen */
.victory-container h2 {
    font-size: 3rem !important;
    margin-bottom: 2rem !important;
}

/* Timer */
#timerDisplay {
    font-family: 'Courier New', monospace !important;
    font-size: 3rem !important;
    font-weight: 900 !important;
    color: #2563eb !important;
    text-shadow: 0 2px 8px rgba(37, 99, 235, 0.3) !important;
    text-align: center !important;
}

#timerBar {
    background: #cbd5e1 !important;
    border-radius: 0.5rem !important;
    overflow: hidden !important;
    height: 12px !important;
    width: 100% !important;
    max-width: 600px !important;
    margin: 1rem auto !important;
}

#timerProgress {
    background: linear-gradient(90deg, #2563eb 0%, #3b82f6 100%) !important;
    transition: width 0.1s linear, background 0.3s !important;
    height: 100% !important;
}

/* Correct answer display */
.correct-answer {
    padding: 1rem !important;
    background: #f1f5f9 !important;
    border-radius: 0.5rem !important;
    color: #0f172a !important;
    font-weight: 600 !important;
    margin: 1rem auto !important;
    border: 2px solid #cbd5e1 !important;
    max-width: 600px !important;
    width: 100% !important;
    text-align: left !important;
}

.correct-answer strong {
    color: #0f172a !important;
}

/* Modal backdrop */
.modal {
    background: rgba(0, 0, 0, 0.75) !important;
    backdrop-filter: blur(8px) !important;
}

/* Section titles dans create */
.team-section h2,
.game-name-section h2 {
    color: #0f172a !important;
    font-size: 1.5rem !important;
    font-weight: 800 !important;
    margin-bottom: 1rem !important;
}

/* Actions du modal */
.modal-actions {
    margin-top: 2rem !important;
    padding-top: 1.5rem !important;
    border-top: 2px solid #e5e7eb !important;
}

/* Paragraphes dans les modals */
.modal-content p {
    color: #475569 !important;
    font-weight: 500 !important;
    line-height: 1.6 !important;
}

/* Conteneurs de grilles */
.team-grid-container,
#attackGridContainer {
    background: white !important;
    padding: 1.5rem !important;
    border-radius: 0.75rem !important;
    border: 2px solid #e5e7eb !important;
    margin: 0 auto !important;
    width: fit-content !important;
}

.team-grid-container.alpha {
    border-color: var(--accent-green) !important;
}

.team-grid-container.omega {
    border-color: var(--accent-purple) !important;
}

/* Centrage UNIQUEMENT des sections d'attaque contenant les grilles */
.attack-container {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
}

/* Centrage des titres de grille */
.attack-container h3,
#attackGridTitle {
    text-align: center !important;
    color: #0f172a !important;
    font-weight: 800 !important;
    margin-bottom: 1rem !important;
    width: 100% !important;
}

/* Wrapper pour les grilles côte à côte dans la création */
.create-container .flex {
    justify-content: center !important;
    align-items: flex-start !important;
    gap: 2rem !important;
}

/* Responsive */
@media (max-width: 768px) {
    h1 {
        font-size: 2rem !important;
    }
    
    .btn {
        padding: 0.625rem 1.25rem !important;
        font-size: 0.875rem !important;
    }
    
    .grid-container {
        grid-template-columns: 30px repeat(6, 1fr) !important;
        grid-template-rows: 30px repeat(6, 1fr) !important;
    }
    
    .team-indicator {
        font-size: 1.5rem !important;
    }
}

/* Animations supplémentaires */
@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.screen.active {
    animation: slideIn 0.3s ease-out !important;
}

/* Amélioration des focus states pour accessibilité */
button:focus-visible,
input:focus-visible {
    outline: 3px solid var(--accent-blue) !important;
    outline-offset: 2px !important;
}

/* Règles supplémentaires pour forcer le contraste partout */
p, span, div:not(.btn):not(.grid-cell) {
    color: inherit !important;
}

.question-container p,
.question-container span,
.question-container div:not(.btn):not(.grid-cell) {
    color: #0f172a !important;
}

.answer-input::placeholder,
#answerInput::placeholder {
    color: #94a3b8 !important;
}

/* Configuration du chronomètre dans le modal */
.modal-content h4 {
    color: #0f172a !important;
    font-weight: 700 !important;
    font-size: 1.25rem !important;
    margin-bottom: 1rem !important;
}

.modal-content label {
    color: #475569 !important;
    font-weight: 600 !important;
}

#timerMinutes,
#timerSeconds {
    text-align: center !important;
    font-family: 'Courier New', monospace !important;
    font-size: 1.5rem !important;
    font-weight: 700 !important;
    color: #0f172a !important;
}

/* Liste des thèmes dans le modal */
#themesModalList {
    max-height: 400px !important;
    overflow-y: auto !important;
}

#themesModalList .theme-checkbox {
    margin-bottom: 0 !important;
}

/* Forcer les labels de grille en blanc sur fond bleu */
.grid-cell.label {
    background: transparent !important;
    border: none !important;
    color: white !important;
    font-weight: 800 !important;
    font-size: 0.95rem !important;
}

/* Supprimer les symboles des cases touchées et manquées */
.grid-cell.hit::before,
.grid-cell.hit::after,
.grid-cell.miss::before,
.grid-cell.miss::after {
    content: '' !important;
    display: none !important;
}

/* Améliorer le contraste des sections d'actions */
.question-actions,
.modal-actions {
    display: flex !important;
    gap: 1rem !important;
    justify-content: center !important;
    flex-wrap: wrap !important;
}

/* Contraste renforcé pour tous les conteneurs blancs */
.menu-container,
.create-container,
.waiting-container,
.question-container,
.attack-container,
.victory-container,
.modal-content {
    background: white !important;
    color: #0f172a !important;
}

/* Titre des grilles centré */
.attack-container h3 {
    text-align: center !important;
}

/* Grilles elles-mêmes */
.grid-container {
    margin-left: auto !important;
    margin-right: auto !important;
}

/* Centrage spécifique pour les sections de création */
.team-section {
    text-align: center !important;
}

.team-section h2 {
    text-align: center !important;
}

   (styles ajoutés - version sans quiz)
   ==================================== */

<script>
// ===================== IndexedDB =====================
class BattleshipDatabase {
    constructor() {
        this.dbName = 'BattleshipDB_v2';
        this.version = 1;
        this.db = null;
    }

    async init() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(this.dbName, this.version);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => { this.db = request.result; resolve(this.db); };
            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains('games')) {
                    const store = db.createObjectStore('games', { keyPath: 'id', autoIncrement: true });
                    store.createIndex('name', 'name', { unique: false });
                    store.createIndex('createdAt', 'createdAt', { unique: false });
                }
            };
        });
    }

    async saveGame(g) {
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction(['games'], 'readwrite');
            const store = tx.objectStore('games');
            const req = g.id ? store.put(g) : store.add(g);
            req.onsuccess = () => { g.id = req.result; resolve(g); };
            req.onerror = () => reject(req.error);
        });
    }

    async getGame(id) {
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction(['games'], 'readonly');
            const req = tx.objectStore('games').get(id);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async getAllGames() {
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction(['games'], 'readonly');
            const req = tx.objectStore('games').getAll();
            req.onsuccess = () => {
                const games = req.result;
                games.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                resolve(games);
            };
            req.onerror = () => reject(req.error);
        });
    }

    async deleteGame(id) {
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction(['games'], 'readwrite');
            const req = tx.objectStore('games').delete(id);
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error);
        });
    }
}

// ===================== Game Application =====================
class BattleshipGame {
    constructor() {
        this.db = new BattleshipDatabase();
        this.currentGame = null;
        this.createMode = { alpha: null, omega: null };
        this.stats = { alpha: { hits: 0, misses: 0 }, omega: { hits: 0, misses: 0 } };
    }

    createEmptyGrid() {
        return Array.from({ length: 6 }, () =>
            Array.from({ length: 6 }, () => ({ ship: false, hit: false, miss: false }))
        );
    }

    resetCreateMode() {
        const makeTeam = () => ({
            ships: [
                { size: 4, placed: false, cells: [] },
                { size: 3, placed: false, cells: [] },
                { size: 3, placed: false, cells: [] },
                { size: 2, placed: false, cells: [] }
            ],
            grid: this.createEmptyGrid(),
            selectedShip: null,
            orientation: 'horizontal'
        });
        this.createMode = { alpha: makeTeam(), omega: makeTeam() };
    }

    async init() {
        try {
            await this.db.init();
            this.showMenu();
        } catch (e) {
            console.error(e);
            this.showModal('Erreur', 'Impossible d\'initialiser la base de données.');
        }
    }

    // ---- Screen navigation ----
    hideAllScreens() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    }

    showMenu() {
        this.currentGame = null;
        this.hideAllScreens();
        document.getElementById('menuScreen').classList.add('active');
        document.getElementById('savedGamesSection').style.display = 'none';
    }

    showCreateGame() {
        this.hideAllScreens();
        document.getElementById('createScreen').classList.add('active');
        this.resetCreateMode();
        this.renderCreateGrid('gridAlpha', 'alpha');
        this.renderCreateGrid('gridOmega', 'omega');
        this.renderShipButtons('alpha');
        this.renderShipButtons('omega');
    }

    // ---- Grid rendering ----
    renderGrid(containerId, grid, clickable, clickFn) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        const rowLabels = ['A','B','C','D','E','F'];

        // Corner
        const corner = document.createElement('div');
        corner.className = 'grid-cell label';
        container.appendChild(corner);

        // Column labels
        for (let j = 0; j < 6; j++) {
            const lbl = document.createElement('div');
            lbl.className = 'grid-cell label';
            lbl.textContent = j + 1;
            container.appendChild(lbl);
        }

        // Rows
        for (let i = 0; i < 6; i++) {
            const rowLbl = document.createElement('div');
            rowLbl.className = 'grid-cell label';
            rowLbl.textContent = rowLabels[i];
            container.appendChild(rowLbl);

            for (let j = 0; j < 6; j++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell playable';
                cell.dataset.row = i;
                cell.dataset.col = j;

                const c = grid[i][j];
                if (c.sunk) { cell.classList.add('sunk'); }
                else if (c.hit) { cell.classList.add('hit'); }
                else if (c.miss) { cell.classList.add('miss'); }
                else if (c.ship) { cell.classList.add('ship'); }

                if (clickable && clickFn) {
                    cell.onclick = () => clickFn(i, j);
                }
                container.appendChild(cell);
            }
        }
    }

    renderCreateGrid(containerId, team) {
        const t = this.createMode[team];
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        const rowLabels = ['A','B','C','D','E','F'];

        const corner = document.createElement('div');
        corner.className = 'grid-cell label';
        container.appendChild(corner);

        for (let j = 0; j < 6; j++) {
            const lbl = document.createElement('div');
            lbl.className = 'grid-cell label';
            lbl.textContent = j + 1;
            container.appendChild(lbl);
        }

        for (let i = 0; i < 6; i++) {
            const rowLbl = document.createElement('div');
            rowLbl.className = 'grid-cell label';
            rowLbl.textContent = rowLabels[i];
            container.appendChild(rowLbl);

            for (let j = 0; j < 6; j++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell playable';
                cell.dataset.row = i;
                cell.dataset.col = j;
                if (t.grid[i][j].ship) cell.classList.add('ship');

                cell.onclick = () => this.handleCreateClick(i, j, team);
                cell.onmouseover = () => this.handleCreateHover(i, j, team);
                cell.onmouseout = () => this.clearPlacing(team);
                container.appendChild(cell);
            }
        }
    }

    renderShipButtons(team) {
        const cap = team.charAt(0).toUpperCase() + team.slice(1);
        const container = document.getElementById(`ships${cap}`);
        container.innerHTML = '';
        const names = ['Porte-avions','Croiseur','Destroyer','Sous-marin'];
        this.createMode[team].ships.forEach((ship, idx) => {
            const btn = document.createElement('button');
            btn.className = 'ship-btn';
            btn.textContent = `${names[idx]} (${ship.size})`;
            if (ship.placed) { btn.classList.add('placed'); btn.disabled = true; }
            if (this.createMode[team].selectedShip === idx) btn.classList.add('selected');
            btn.onclick = () => this.selectShip(team, idx);
            container.appendChild(btn);
        });
    }

    selectShip(team, idx) {
        if (this.createMode[team].ships[idx].placed) return;
        this.createMode[team].selectedShip = idx;
        this.renderShipButtons(team);
    }

    toggleOrientation(team) {
        const t = this.createMode[team];
        t.orientation = t.orientation === 'horizontal' ? 'vertical' : 'horizontal';
        const cap = team.charAt(0).toUpperCase() + team.slice(1);
        document.getElementById(`orientation${cap}`).textContent =
            t.orientation === 'horizontal' ? 'Horizontal' : 'Vertical';
    }

    getShipCells(row, col, size, orientation) {
        const cells = [];
        for (let k = 0; k < size; k++) {
            cells.push(orientation === 'horizontal' ? [row, col + k] : [row + k, col]);
        }
        return cells;
    }

    canPlaceShip(team, row, col, size, orientation) {
        const cells = this.getShipCells(row, col, size, orientation);
        for (const [r, c] of cells) {
            if (r < 0 || r >= 6 || c < 0 || c >= 6) return false;
            if (this.createMode[team].grid[r][c].ship) return false;
        }
        return true;
    }

    handleCreateHover(row, col, team) {
        const t = this.createMode[team];
        if (t.selectedShip === null) return;
        const ship = t.ships[t.selectedShip];
        if (ship.placed) return;
        this.clearPlacing(team);
        if (this.canPlaceShip(team, row, col, ship.size, t.orientation)) {
            const cap = team.charAt(0).toUpperCase() + team.slice(1);
            const gridEl = document.getElementById(`grid${cap}`);
            this.getShipCells(row, col, ship.size, t.orientation).forEach(([r, c]) => {
                const cell = gridEl.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                if (cell) cell.classList.add('placing');
            });
        }
    }

    clearPlacing(team) {
        const cap = team.charAt(0).toUpperCase() + team.slice(1);
        document.getElementById(`grid${cap}`).querySelectorAll('.placing')
            .forEach(c => c.classList.remove('placing'));
    }

    handleCreateClick(row, col, team) {
        const t = this.createMode[team];
        if (t.selectedShip === null) {
            this.showModal('Attention', 'Sélectionnez d\'abord un navire à placer.');
            return;
        }
        const ship = t.ships[t.selectedShip];
        if (!this.canPlaceShip(team, row, col, ship.size, t.orientation)) {
            this.showModal('Placement impossible', 'Le navire ne peut pas être placé ici.');
            return;
        }
        const cells = this.getShipCells(row, col, ship.size, t.orientation);
        cells.forEach(([r, c]) => { t.grid[r][c].ship = true; });
        ship.cells = cells.map(([r, c]) => ({ row: r, col: c }));
        ship.placed = true;
        t.selectedShip = null;
        this.renderCreateGrid(`grid${team.charAt(0).toUpperCase() + team.slice(1)}`, team);
        this.renderShipButtons(team);
    }

    async finalizeGame() {
        const gameName = document.getElementById('gameName').value.trim();
        if (!gameName) { this.showModal('Erreur', 'Veuillez entrer un nom pour la partie.'); return; }

        if (!this.createMode.alpha.ships.every(s => s.placed) ||
            !this.createMode.omega.ships.every(s => s.placed)) {
            this.showModal('Erreur', 'Tous les navires doivent être placés pour les deux équipes.');
            return;
        }

        const gameData = {
            name: gameName,
            currentTeam: 'alpha',
            alpha: {
                grid: JSON.parse(JSON.stringify(this.createMode.alpha.grid)),
                ships: this.createMode.alpha.ships.map(s => ({ size: s.size, cells: s.cells }))
            },
            omega: {
                grid: JSON.parse(JSON.stringify(this.createMode.omega.grid)),
                ships: this.createMode.omega.ships.map(s => ({ size: s.size, cells: s.cells }))
            },
            stats: { alpha: { hits: 0, misses: 0 }, omega: { hits: 0, misses: 0 } },
            createdAt: new Date().toISOString()
        };

        try {
            await this.db.saveGame(gameData);
            this.currentGame = gameData;
            this.startBattle();
        } catch (e) {
            console.error(e);
            this.showModal('Erreur', 'Impossible de créer la partie.');
        }
    }

    async loadSavedGames() {
        const games = await this.db.getAllGames();
        const gameList = document.getElementById('gameList');
        const section = document.getElementById('savedGamesSection');
        if (games.length === 0) { this.showModal('Information', 'Aucune partie sauvegardée.'); return; }

        gameList.innerHTML = '';
        games.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            const alive = (team) => game[team].ships
                ? game[team].ships.filter(s => !s.cells.every(c => game[team].grid[c.row][c.col].hit)).length
                : '?';
            card.innerHTML = `
                <div class="game-info">
                    <h3>${game.name}</h3>
                    <div class="game-meta">
                        <span>Tour : ${game.currentTeam === 'alpha' ? 'Alpha' : 'Oméga'}</span>
                        <span>Alpha : ${alive('alpha')} navires</span>
                        <span>Oméga : ${alive('omega')} navires</span>
                    </div>
                </div>
                <button class="delete-btn" onclick="gameApp.deleteGame(event, ${game.id})">Supprimer</button>`;
            card.onclick = (e) => { if (!e.target.classList.contains('delete-btn')) this.loadGame(game.id); };
            gameList.appendChild(card);
        });
        section.style.display = 'block';
    }

    async deleteGame(event, id) {
        event.stopPropagation();
        if (confirm('Supprimer cette partie ?')) {
            await this.db.deleteGame(id);
            this.loadSavedGames();
        }
    }

    async loadGame(id) {
        this.currentGame = await this.db.getGame(id);
        if (!this.currentGame.stats) this.currentGame.stats = { alpha:{hits:0,misses:0}, omega:{hits:0,misses:0} };
        this.startBattle();
    }

    // ===================== BATTLE =====================
    startBattle() {
        this.hideAllScreens();
        document.getElementById('battleScreen').classList.add('active');
        this.renderBattle();
    }

    renderBattle() {
        const g = this.currentGame;
        const currentTeam = g.currentTeam;
        const opponentTeam = currentTeam === 'alpha' ? 'omega' : 'alpha';

        // Turn indicator
        const indicator = document.getElementById('turnIndicator');
        indicator.textContent = `Tour de l'Équipe ${currentTeam === 'alpha' ? 'Alpha' : 'Oméga'} — Tirez sur la grille adverse !`;
        indicator.className = `turn-indicator ${currentTeam}`;

        // Update panels
        ['alpha', 'omega'].forEach(team => {
            const isOwn = team === currentTeam;
            const panel = document.getElementById(`panel${team.charAt(0).toUpperCase() + team.slice(1)}`);
            const gridId = `battleGrid${team.charAt(0).toUpperCase() + team.slice(1)}`;
            const subtitleId = `subtitle${team.charAt(0).toUpperCase() + team.slice(1)}`;

            // Clear panel state classes
            panel.classList.remove('target-active', 'own-grid');

            if (isOwn) {
                // Own grid — show ships, no clicking
                panel.classList.add('own-grid');
                document.getElementById(subtitleId).textContent = 'Votre flotte';
                this.renderGrid(gridId, g[team].grid, false, null);
            } else {
                // Opponent grid — hide intact ships, allow clicking
                panel.classList.add('target-active');
                document.getElementById(subtitleId).textContent = 'Grille adverse — cliquez pour tirer !';
                const displayGrid = this.makeDisplayGrid(g[team].grid);
                this.renderGrid(gridId, displayGrid, true, (row, col) => this.handleAttack(row, col, team));
            }

            // Ship counter
            const alive = this.countAliveShips(team);
            const counter = document.getElementById(`counter${team.charAt(0).toUpperCase() + team.slice(1)}`);
            counter.textContent = `${alive} navire${alive !== 1 ? 's' : ''} actif${alive !== 1 ? 's' : ''}`;
        });
    }

    makeDisplayGrid(grid) {
        // Deep clone but hide intact ships
        return grid.map(row => row.map(cell => ({
            ship: cell.ship && (cell.hit || cell.sunk), // only show ship cells that are already hit
            hit: cell.hit,
            miss: cell.miss,
            sunk: cell.sunk
        })));
    }

    countAliveShips(team) {
        const g = this.currentGame;
        return g[team].ships.filter(ship =>
            !ship.cells.every(c => g[team].grid[c.row][c.col].hit || g[team].grid[c.row][c.col].sunk)
        ).length;
    }

    async handleAttack(row, col, targetTeam) {
        const g = this.currentGame;
        const cell = g[targetTeam].grid[row][col];
        const attackingTeam = g.currentTeam;
        const msgId = `msg${targetTeam.charAt(0).toUpperCase() + targetTeam.slice(1)}`;

        if (cell.hit || cell.miss || cell.sunk) return; // already shot

        if (!g.stats) g.stats = { alpha: {hits:0,misses:0}, omega:{hits:0,misses:0} };

        if (cell.ship) {
            cell.hit = true;
            g.stats[attackingTeam].hits++;

            // Check if the ship is now fully sunk
            const sunkShip = g[targetTeam].ships.find(ship =>
                ship.cells.some(c => c.row === row && c.col === col) &&
                ship.cells.every(c => g[targetTeam].grid[c.row][c.col].hit || g[targetTeam].grid[c.row][c.col].sunk)
            );

            if (sunkShip) {
                // Mark all cells as sunk
                sunkShip.cells.forEach(c => {
                    g[targetTeam].grid[c.row][c.col].hit = false;
                    g[targetTeam].grid[c.row][c.col].sunk = true;
                });
                this.showMsg(msgId, `💥 Coulé ! Le ${this.shipName(sunkShip.size)} est détruit !`, 'sunk-msg');
            } else {
                this.showMsg(msgId, '🎯 Touché !', 'hit-msg');
            }
        } else {
            cell.miss = true;
            g.stats[attackingTeam].misses++;
            this.showMsg(msgId, '💦 Manqué !', 'miss-msg');
        }

        // Animate the cell
        const gridEl = document.getElementById(`battleGrid${targetTeam.charAt(0).toUpperCase() + targetTeam.slice(1)}`);
        const shotCell = gridEl.querySelector(`[data-row="${row}"][data-col="${col}"]`);
        if (shotCell) {
            shotCell.classList.add('just-shot');
            setTimeout(() => shotCell.classList.remove('just-shot'), 400);
        }

        await this.db.saveGame(g);

        // Check victory
        if (this.checkVictory(targetTeam)) {
            await this.showVictory();
            return;
        }

        // Re-render to reflect changes
        this.renderBattle();
    }

    shipName(size) {
        const names = { 4: 'Porte-avions', 3: 'Croiseur', 2: 'Sous-marin' };
        return names[size] || `navire (${size})`;
    }

    showMsg(id, text, cls) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = `last-shot-msg ${cls}`;
    }

    checkVictory(targetTeam) {
        const grid = this.currentGame[targetTeam].grid;
        for (let i = 0; i < 6; i++) {
            for (let j = 0; j < 6; j++) {
                if (grid[i][j].ship && !grid[i][j].hit && !grid[i][j].sunk) return false;
            }
        }
        return true;
    }

    endTurn() {
        const g = this.currentGame;
        g.currentTeam = g.currentTeam === 'alpha' ? 'omega' : 'alpha';
        // Clear messages
        document.getElementById('msgAlpha').textContent = '';
        document.getElementById('msgOmega').textContent = '';
        this.db.saveGame(g);
        this.renderBattle();
    }

    async showVictory() {
        this.hideAllScreens();
        document.getElementById('victoryScreen').classList.add('active');

        const winner = this.currentGame.currentTeam;
        const el = document.getElementById('victoryTeam');
        el.textContent = `Équipe ${winner === 'alpha' ? 'Alpha' : 'Oméga'} Victorieuse !`;
        el.className = winner;

        const stats = this.currentGame.stats || { alpha:{hits:0,misses:0}, omega:{hits:0,misses:0} };
        const statsEl = document.getElementById('victoryStats');
        statsEl.innerHTML = `
            <div class="stat-block alpha">
                <div class="stat-label">Alpha — Tirs réussis</div>
                <div class="stat-value">${stats.alpha.hits}</div>
            </div>
            <div class="stat-block alpha">
                <div class="stat-label">Alpha — Tirs manqués</div>
                <div class="stat-value">${stats.alpha.misses}</div>
            </div>
            <div class="stat-block omega">
                <div class="stat-label">Oméga — Tirs réussis</div>
                <div class="stat-value">${stats.omega.hits}</div>
            </div>
            <div class="stat-block omega">
                <div class="stat-label">Oméga — Tirs manqués</div>
                <div class="stat-value">${stats.omega.misses}</div>
            </div>`;

        await this.db.deleteGame(this.currentGame.id);
    }

    async returnToMenu() {
        if (this.currentGame) {
            await this.db.saveGame(this.currentGame);
        }
        this.showMenu();
    }

    showModal(title, msg) {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalMessage').textContent = msg;
        document.getElementById('modal').classList.add('active');
    }

    closeModal() {
        document.getElementById('modal').classList.remove('active');
    }
}

const gameApp = new BattleshipGame();
window.addEventListener('DOMContentLoaded', () => gameApp.init());
</script>
</body>
</html>
